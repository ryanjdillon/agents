# Run with prek (or pre-commit): `prek install` one time in each clone.
# CI runs the same checks without these hooks. See docs/ci-and-checks.md.
repos:
  - repo: local
    hooks:
      - id: check-skills
        name: check skills
        entry: just check-skills
        language: system
        pass_filenames: false
        files: ^skills/
      - id: treefmt
        name: treefmt
        entry: nix fmt -- --fail-on-change
        language: system
        pass_filenames: false
  - repo: https://github.com/ryanjdillon/workflows
    rev: eb0eae46c65049d246c8c84471206619c38f0115 # main
    hooks:
      - id: check-instructions
