# Run with prek (or pre-commit): `prek install` one time in each clone.
# CI runs the same checks without these hooks. See docs/ci-and-checks.md.
repos:
  - repo: local
    hooks:
      - id: check-skills
        name: check skills
        entry: just check-skills
        language: system
        pass_filenames: false
        files: ^skills/
      - id: treefmt
        name: treefmt
        entry: nix fmt -- --fail-on-change
        language: system
        pass_filenames: false
  - repo: https://github.com/ryanjdillon/workflows
    rev: ebb73dbf81f54d7bf8ddb23e5b8e0783e7926acd # frozen: v1.2.2
    hooks:
      - id: check-instructions
        # The shared hook knows only AGENTS.md and SYSTEM.md.
        files: ^(AGENTS|SYSTEM|WORKFLOW)\.md$
