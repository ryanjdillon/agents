name: check

# CI does not install Nix: a cold install and toolchain download cost minutes
# on each run. The checks here run with the runner's Python and pinned actions.
# Changes to Nix files also run nix.yml.
#
# Third-party actions are pinned by commit SHA: a tag is mutable.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skills
        run: python3 scripts/validate-skills.py skills

      - name: Promotion tests
        run: python3 -m unittest discover -s scripts

      - uses: ryanjdillon/workflows/check-instructions@1780e7acefae60e74038e392a7e6d3e4e2b06210 # v1.4.0
        with:
          files: SYSTEM.md WORKFLOW.md AGENTS.md

      - name: No template syntax in the prompt files
        # pi renders its system prompt as a template. Same as `just check-templates`.
        run: "test -f SYSTEM.md && test -f WORKFLOW.md && ! grep -n '{{' SYSTEM.md WORKFLOW.md"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.17.6
          args: format --check

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.17.6
