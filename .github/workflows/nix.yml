name: nix

# Nix checks run only when Nix files change, so normal CI stays fast.

on:
  pull_request:
    paths: ["**.nix", "flake.lock"]
  push:
    branches: [main]
    paths: ["**.nix", "flake.lock"]

permissions:
  contents: read

jobs:
  nix:
    uses: ryanjdillon/workflows/.github/workflows/nix-check.yml@eb0eae46c65049d246c8c84471206619c38f0115 # main
