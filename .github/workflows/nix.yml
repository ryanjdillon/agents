name: nix

# Nix checks run only when Nix files change, so normal CI stays fast.

on:
  pull_request:
    paths: ["**.nix", "flake.lock"]
  push:
    branches: [main]
    paths: ["**.nix", "flake.lock"]

permissions:
  contents: read

jobs:
  nix:
    uses: ryanjdillon/workflows/.github/workflows/nix-check.yml@1780e7acefae60e74038e392a7e6d3e4e2b06210 # v1.4.0
