name: nix

# Nix checks run only when Nix files change, so normal CI stays fast.

on:
  pull_request:
    paths: ["**.nix", "flake.lock"]
  push:
    branches: [main]
    paths: ["**.nix", "flake.lock"]

permissions:
  contents: read

jobs:
  nix:
    uses: ryanjdillon/workflows/.github/workflows/nix-check.yml@ebb73dbf81f54d7bf8ddb23e5b8e0783e7926acd # v1.2.2
